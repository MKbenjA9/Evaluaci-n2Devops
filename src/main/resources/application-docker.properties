# ============================================================
# Perfil Docker - Order Manager (DOY0101)
# ============================================================
spring.application.name=order-manager

# Base de datos PostgreSQL en red de contenedores
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:orderdb}
spring.datasource.username=${DB_USER:orderuser}
spring.datasource.password=${DB_PASSWORD:orderpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator Endpoints para Monitoreo y Healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Servidor Web
server.port=8098
