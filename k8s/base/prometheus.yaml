apiVersion: "v1"
kind: "Service"
metadata:
  name: "prometheus"
  namespace: "monitoring"
spec:
  selector:
    app.kubernetes.io/name: "prometheus"
  ports:
    -
      name: "main"
      port: 9090
      targetPort: "main"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "prometheus-data"
  namespace: "monitoring"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "prometheus"
  namespace: "monitoring"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "prometheus"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "prometheus"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "prometheus"
          image: "prom/prometheus:v3.16.0"
          ports:
            -
              name: "main"
              containerPort: 9090
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: "/-/healthy"
              port: "main"
            periodSeconds: 4
            timeoutSeconds: 3
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: "/-/ready"
              port: "main"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/-/healthy"
              port: "main"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=48h"
            - "--storage.tsdb.retention.size=4GB"
          volumeMounts:
            -
              name: "data"
              mountPath: "/prometheus"
            -
              name: "config"
              mountPath: "/etc/prometheus"
              readOnly: true
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "prometheus-data"
        -
          name: "config"
          configMap:
            name: "prometheus-config"
