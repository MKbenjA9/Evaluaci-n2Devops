apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "order-manager-env"
  namespace: "order-manager"
data:
  SPRING_PROFILES_ACTIVE: "docker"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "orderdb"
  JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseG1GC"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "order-manager"
  namespace: "order-manager"
spec:
  selector:
    app.kubernetes.io/name: "order-manager"
  ports:
    -
      name: "main"
      port: 8098
      targetPort: "main"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "order-manager"
  namespace: "order-manager"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "order-manager"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "order-manager"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "api"
          image: "order-manager:placeholder"
          ports:
            -
              name: "main"
              containerPort: 8098
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: "/actuator/health/liveness"
              port: "main"
            periodSeconds: 4
            timeoutSeconds: 3
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: "/actuator/health/readiness"
              port: "main"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/actuator/health/liveness"
              port: "main"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          envFrom:
            -
              configMapRef:
                name: "order-manager-env"
          env:
            -
              name: "DB_USER"
              valueFrom:
                secretKeyRef:
                  name: "postgres-auth"
                  key: "username"
            -
              name: "DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "postgres-auth"
                  key: "password"
