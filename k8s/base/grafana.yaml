apiVersion: "v1"
kind: "Service"
metadata:
  name: "grafana"
  namespace: "monitoring"
spec:
  selector:
    app.kubernetes.io/name: "grafana"
  ports:
    -
      name: "main"
      port: 3000
      targetPort: "main"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "grafana-data"
  namespace: "monitoring"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "2Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "grafana"
  namespace: "monitoring"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "grafana"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "grafana"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "grafana"
          image: "grafana/grafana:13.3.1-ubuntu"
          ports:
            -
              name: "main"
              containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: "/api/health"
              port: "main"
            periodSeconds: 4
            timeoutSeconds: 3
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: "/api/health"
              port: "main"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/api/health"
              port: "main"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          env:
            -
              name: "GF_SECURITY_ADMIN_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "grafana-auth"
                  key: "password"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/grafana"
            -
              name: "datasources"
              mountPath: "/etc/grafana/provisioning/datasources"
              readOnly: true
            -
              name: "provider"
              mountPath: "/etc/grafana/provisioning/dashboards"
              readOnly: true
            -
              name: "dashboards"
              mountPath: "/etc/grafana/dashboards"
              readOnly: true
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "grafana-data"
        -
          name: "datasources"
          configMap:
            name: "grafana-datasources"
        -
          name: "provider"
          configMap:
            name: "grafana-provider"
        -
          name: "dashboards"
          configMap:
            name: "grafana-dashboards"
