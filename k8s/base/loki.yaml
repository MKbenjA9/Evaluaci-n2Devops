apiVersion: "v1"
kind: "Service"
metadata:
  name: "loki"
  namespace: "monitoring"
spec:
  selector:
    app.kubernetes.io/name: "loki"
  ports:
    -
      name: "main"
      port: 3100
      targetPort: "main"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "loki-data"
  namespace: "monitoring"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "loki"
  namespace: "monitoring"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "loki"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "loki"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "loki"
          image: "grafana/loki:3.7.8"
          ports:
            -
              name: "main"
              containerPort: 3100
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: "/ready"
              port: "main"
            periodSeconds: 4
            timeoutSeconds: 3
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: "/ready"
              port: "main"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/ready"
              port: "main"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          args:
            - "-config.file=/etc/loki/loki.yml"
          volumeMounts:
            -
              name: "data"
              mountPath: "/loki"
            -
              name: "config"
              mountPath: "/etc/loki"
              readOnly: true
      volumes:
        -
          name: "data"
          persistentVolumeClaim:
            claimName: "loki-data"
        -
          name: "config"
          configMap:
            name: "loki-config"
