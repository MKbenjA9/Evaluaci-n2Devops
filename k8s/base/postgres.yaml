apiVersion: "v1"
kind: "Service"
metadata:
  name: "postgres"
  namespace: "order-manager"
spec:
  clusterIP: "None"
  selector:
    app.kubernetes.io/name: "postgres"
  ports:
    -
      name: "main"
      port: 5432
      targetPort: "main"
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "postgres"
  namespace: "order-manager"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "postgres"
  serviceName: "postgres"
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "5Gi"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "postgres"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "postgres"
          image: "postgres:16-alpine"
          ports:
            -
              name: "main"
              containerPort: 5432
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            periodSeconds: 4
            timeoutSeconds: 3
            failureThreshold: 45
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          env:
            -
              name: "POSTGRES_DB"
              value: "orderdb"
            -
              name: "PGDATA"
              value: "/var/lib/postgresql/data/pgdata"
            -
              name: "POSTGRES_USER"
              valueFrom:
                secretKeyRef:
                  name: "postgres-auth"
                  key: "username"
            -
              name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "postgres-auth"
                  key: "password"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/postgresql/data"
