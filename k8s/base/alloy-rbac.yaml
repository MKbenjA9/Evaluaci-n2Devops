apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "alloy"
  namespace: "monitoring"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "alloy-logs"
  namespace: "order-manager"
rules:
  -
    apiGroups:
      - ""
    resources:
      - "pods"
    verbs:
      - "get"
      - "list"
      - "watch"
  -
    apiGroups:
      - ""
    resources:
      - "pods/log"
    verbs:
      - "get"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  name: "alloy-logs"
  namespace: "order-manager"
subjects:
  -
    kind: "ServiceAccount"
    name: "alloy"
    namespace: "monitoring"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: "alloy-logs"
