apiVersion: "kustomize.config.k8s.io/v1beta1"
kind: "Kustomization"
resources:
  - "../../base"
  - "storageclass-gp3.yaml"
patches:
  -
    target:
      kind: "PersistentVolumeClaim"
      namespace: "monitoring"
    patch: "- op: add\n  path: /spec/storageClassName\n  value: order-manager-gp3"
  -
    target:
      kind: "StatefulSet"
      name: "postgres"
      namespace: "order-manager"
    patch: "- op: add\n  path: /spec/volumeClaimTemplates/0/spec/storageClassName\n  value: order-manager-gp3"
